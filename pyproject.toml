[project]
name = "myfuturegain"
version = "0.1.0"
description = "placeholder"
authors = [
    { name = "domino403", email = "gildominik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm[proxy]>=1.108.3",
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
    "zensical",
]

[tool.uv.workspace]
members = [
    "Source_Code/back_end",
    "Source_Code/data_base",
    "Source_Code/data_api",
    "Source_Code/front_end",
    "Tests",
]


[tool.ruff]
line-length = 120
output-format = "grouped"

[tool.ruff.lint]
extend-select = [
    "FAST",
    "NPY",
    "PTH",
    "PT",
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = "dynamic"

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint.isort]
# Use a single line after each import block.
lines-after-imports = 2


[tool.pytest.ini.options]
addopts = "-ra --strict-markers"

testpaths = [
    "Tests/back_end",
    "Tests/data_api",
    "Tests/data_base",
    "Tests/front_end",
]

pythonpath = [
    "./Source_Code/data_api",
]
